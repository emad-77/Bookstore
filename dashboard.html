<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <input type="checkbox" id="theme-toggle">

    <div class="page-wrapper">
        <header>
            <a href="index.html" class="logo">BookHaven.</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalog.html">Catalog</a></li>
                    <li><a href="book-details.html">Book Details</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="cart.html" class="cart-link">Shopping Cart <span class="cart-count empty">0</span></a></li>
                    <li><a href="track-order.html" class="track-link">Track Order</a></li>
                    <li><label for="theme-toggle" class="theme-btn">Switch Theme</label></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="section-header">
                <h2 class="section-title">Admin Dashboard</h2>
                <button type="button" id="reset-books" class="btn-outline" style="padding: 0.5rem 1.2rem;">Restore default books</button>
            </div>

            <div class="dash-stats" id="dash-stats"></div>

            <section class="dash-card">
                <h3 id="form-title">Add a New Book</h3>
                <form id="book-form" novalidate>
                    <input type="hidden" id="f-id">
                    <div class="dash-form-grid">
                        <div class="form-group"><label for="f-title">Title</label><input type="text" id="f-title" placeholder="e.g. Clean Code"></div>
                        <div class="form-group"><label for="f-subtitle">Subtitle (optional)</label><input type="text" id="f-subtitle"></div>
                        <div class="form-group"><label for="f-author">Author</label><input type="text" id="f-author"></div>
                        <div class="form-group"><label for="f-category">Category</label><select id="f-category"></select></div>
                        <div class="form-group"><label for="f-price">Price ($)</label><input type="number" id="f-price" min="0" step="0.01"></div>
                        <div class="form-group"><label for="f-stock">Stock (copies)</label><input type="number" id="f-stock" min="0" step="1"></div>
                        <div class="form-group"><label for="f-pages">Pages</label><input type="text" id="f-pages"></div>
                        <div class="form-group"><label for="f-language">Language</label><input type="text" id="f-language" placeholder="English"></div>
                        <div class="form-group"><label for="f-isbn">ISBN</label><input type="text" id="f-isbn"></div>
                        <div class="form-group"><label for="f-color">Cover color</label><select id="f-color"></select></div>
                    </div>
                    <div class="form-group"><label for="f-desc">Description</label><textarea id="f-desc" rows="3"></textarea></div>
                    <label class="check"><input type="checkbox" id="f-featured"> Show on the home page (Trending Books)</label>
                    <p class="form-error" id="f-error"></p>
                    <div class="dash-actions">
                        <button type="submit" class="btn-primary" id="f-submit">Add Book</button>
                        <button type="button" class="btn-outline" id="f-cancel" hidden>Cancel edit</button>
                    </div>
                </form>
            </section>

            <section class="dash-card">
                <h3>Inventory</h3>
                <div class="table-wrap">
                    <table class="dash-table" id="books-table">
                        <thead>
                            <tr><th></th><th>Book</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="dash-card">
                <h3>Customer Messages</h3>
                <div id="messages-list"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 BookHaven Online Bookstore System. All rights reserved.</p>
        </footer>
    </div>
    <script src="bookhaven.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
