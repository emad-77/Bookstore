<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven | Sign In</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <input type="checkbox" id="theme-toggle">

    <div class="page-wrapper">
        <header>
            <a href="index.html" class="logo">BookHaven.</a>
            <nav>
                <ul>
                    <li><a href="login.html" class="active">Sign In</a></li>
                    <li><a href="register.html">Register</a></li>
                    <li><label for="theme-toggle" class="theme-btn">Switch Theme</label></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="contact-container">
                <h2 class="section-title" style="margin-bottom: 1.5rem;">Sign In</h2>
                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <p class="form-error" id="form-error"></p>
                    <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
                </form>
                <p class="form-note">New to BookHaven? <a href="register.html">Create an account</a></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BookHaven Online Bookstore System. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
