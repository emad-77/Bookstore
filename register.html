<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven | Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <input type="checkbox" id="theme-toggle">

    <div class="page-wrapper">
        <header>
            <a href="index.html" class="logo">BookHaven.</a>
            <nav>
                <ul>
                    <li><a href="login.html">Sign In</a></li>
                    <li><a href="register.html" class="active">Register</a></li>
                    <li><label for="theme-toggle" class="theme-btn">Switch Theme</label></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="contact-container">
                <h2 class="section-title" style="margin-bottom: 1.5rem;">Create Account</h2>
                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required>
                    </div>
                    <p class="form-error" id="form-error"></p>
                    <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
                </form>
                <p class="form-note">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BookHaven Online Bookstore System. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
