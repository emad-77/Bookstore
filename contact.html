<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven | Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <input type="checkbox" id="theme-toggle">

    <div class="page-wrapper">
        <header>
            <a href="index.html" class="logo">BookHaven.</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalog.html">Catalog</a></li>
                    <li><a href="book-details.html">Book Details</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                    <li><a href="cart.html" class="cart-link">Shopping Cart <span class="cart-count empty">0</span></a></li>
                    <li><a href="track-order.html" class="track-link">Track Order</a></li>
                    <li><label for="theme-toggle" class="theme-btn">Switch Theme</label></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="contact-container">
                <h2 class="section-title" style="margin-bottom: 1.5rem;">Contact Us</h2>
                <form id="contact-form" action="#" method="post">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Book Inquiry / Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Looking for a specific book?" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                    </div>
                    <p id="contact-status" role="status" class="form-success"></p>
                    <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 BookHaven Online Bookstore System. All rights reserved.</p>
        </footer>
    </div>
    <script src="bookhaven.js"></script>
</body>
</html>
